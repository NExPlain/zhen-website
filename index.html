<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zhen Li</title>
<link href="/images/favicon/apple-icon-57x57.png" rel="apple-touch-icon" sizes="57x57">

<link href="/images/favicon/apple-icon-120x120.png" rel="apple-touch-icon" sizes="120x120">
<link href="/images/favicon/apple-icon-144x144.png" rel="apple-touch-icon" sizes="144x144">
<link href="/images/favicon/apple-icon-152x152.png" rel="apple-touch-icon" sizes="152x152">
<link href="/images/favicon/apple-icon-180x180.png" rel="apple-touch-icon" sizes="180x180">

<meta content="website" property="og:type">
<meta content="Zhen Li - Engineering Lead at Replit" property="og:title">
<meta content="Engineering Lead (Senior Staff AI Engineer) at Replit. Creator & Lead Engineer of Replit Agent. Former Google, ByteDance/TikTok." property="og:description">
<meta content="/images/profile.jpeg" property="og:image">
<meta content="summary_large_image" name="twitter:card">
<meta content="Zhen Li - Engineering Lead at Replit" name="twitter:title">
<meta content="Engineering Lead (Senior Staff AI Engineer) at Replit. Creator & Lead Engineer of Replit Agent. Former Google, ByteDance/TikTok." name="twitter:description">
<meta content="/images/profile.jpeg" name="twitter:image">
<meta content="Engineering Lead (Senior Staff AI Engineer) at Replit. Creator & Lead Engineer of Replit Agent. Former Google, ByteDance/TikTok." name="description">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#f3f0ea; --card:#fbfaf7; --ink:#1c1b18; --muted:#6b665d; --line:#e4dfd5; --accent:#c2541a; --r:18px; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font:15px/1.6 Inter, system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  a:focus-visible { outline:2px solid var(--accent); outline-offset:3px; border-radius:6px; }
  section[id], h2[id] { scroll-margin-top:80px; }
  .wrap { max-width:1160px; margin:0 auto; padding:28px 28px 60px; }
  .k { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .serif { font-family:Fraunces, serif; font-weight:500; letter-spacing:-.015em; }

  /* intro */
  .intro { display:grid; grid-template-columns:1fr 240px; gap:16px; }
  .me { background:var(--card); border-radius:var(--r); padding:34px 36px; display:flex; flex-direction:column; justify-content:space-between; gap:28px; }
  .me .head { display:flex; justify-content:space-between; align-items:center; gap:16px; }
  .me .mini { display:none; width:64px; height:64px; border-radius:14px; background:url(/images/profile.jpeg) center/cover; flex:none; }
  .me h1 { font:500 54px/1 Fraunces, serif; letter-spacing:-.03em; }
  .me h1 span { font:400 22px Inter; color:var(--muted); margin-left:10px; letter-spacing:0; }
  .me p { font-size:17px; color:#4a4740; max-width:560px; }
  .me .links { display:flex; flex-wrap:wrap; gap:6px 20px; font-size:14px; color:var(--ink); }
  .me .links a { border-bottom:1px solid #cfc8bb; padding:4px 0; }
  .me .links a:hover { color:var(--accent); border-color:var(--accent); }
  .avatar { border-radius:var(--r); background:url(/images/profile.jpeg) center/cover; min-height:260px; }

  /* nav */
  .nav { position:sticky; top:12px; z-index:5; display:flex; justify-content:center; margin:22px 0 8px; }
  .nav div { background:rgba(251,250,247,.9); backdrop-filter:blur(10px); border:1px solid var(--line); border-radius:999px; padding:4px; display:flex; gap:2px; }
  .nav a { font-size:13px; padding:7px 14px; border-radius:999px; color:var(--muted); }
  .nav a.on, .nav a:hover { background:var(--ink); color:#fff; }

  h2.sec { display:flex; justify-content:space-between; align-items:baseline; margin:54px 2px 18px; }
  h2.sec b { font:500 30px/1 Fraunces, serif; letter-spacing:-.02em; }

  /* hero ship */
  .hero { display:grid; grid-template-columns:1.6fr 1fr; background:var(--card); border-radius:var(--r); overflow:hidden; }
  .hero .img { background:#14112b center/cover; min-height:380px; }
  .hero .txt { padding:34px; display:flex; flex-direction:column; justify-content:space-between; gap:20px; }
  .hero h3 { font:500 38px/1.05 Fraunces, serif; letter-spacing:-.02em; margin:10px 0 14px; }
  .hero p { color:#4a4740; }

  /* cards */
  .grid.two { grid-template-columns:repeat(2,1fr); }
  .grid.four { grid-template-columns:repeat(4,1fr); }
  .grid.four .card h3 { font-size:18px; }
  .card .poster b.sm { font-size:32px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:16px; }
  .card { background:var(--card); border-radius:var(--r); overflow:hidden; display:flex; flex-direction:column; }
  .card > a.img { display:block; }
  .card h3 a { background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat; transition:background-size .35s; }
  .card:has(a:hover) h3 a, .card h3 a:focus-visible { background-size:100% 1px; }
  .card .img { aspect-ratio:16/9; overflow:hidden; background:#ebe6dd; }
  .card .img img { width:100%; height:100%; object-fit:cover; transition:transform 1s cubic-bezier(.2,.7,.2,1); }
  .card .img.contain img { object-fit:contain; padding:8px; }
  .card a.img:hover img, .card:has(h3 a:hover) .img img { transform:scale(1.03); }
  .card .poster { width:100%; height:100%; display:flex; flex-direction:column; justify-content:flex-end; padding:20px; background:#e9e3d8; }
  .card .poster b { font:500 46px/1 Fraunces, serif; color:#3a372f; letter-spacing:-.02em; }
  .card .body { padding:18px 20px 20px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .card h3 { font:500 20px/1.2 Fraunces, serif; letter-spacing:-.01em; }
  .card p { color:#5b574f; font-size:14px; }
  .lk { display:flex; flex-wrap:wrap; gap:4px 16px; font-size:13px; margin-top:auto; padding-top:8px; }
  .lk a { color:var(--ink); border-bottom:1px solid #cfc8bb; padding:6px 0 2px; }
  .lk a:hover { color:var(--accent); border-color:var(--accent); }

  /* list */
  .list { margin-top:16px; background:var(--card); border-radius:var(--r); padding:6px 24px; }
  .list { padding:6px 10px; }
  .list a { display:grid; grid-template-columns:96px 1fr auto 20px; align-items:center; gap:16px; padding:13px 14px; border-radius:12px; font-size:15px; position:relative; }
  .list a + a::before { content:""; position:absolute; left:14px; right:14px; top:0; border-top:1px solid var(--line); }
  .list a:hover { background:#f1ece3; } .list a:hover::before, .list a:hover + a::before { border-color:transparent; }
  .list .t { text-decoration:underline; text-decoration-color:#cfc8bb; text-underline-offset:4px; text-decoration-thickness:1px; }
  .list a:hover .t { color:var(--accent); text-decoration-color:var(--accent); }
  .list .sub { display:block; color:var(--muted); font-size:13px; margin-top:2px; text-decoration:none; }
  .list .act { font-size:12px; color:var(--muted); white-space:nowrap; display:flex; align-items:center; gap:10px; }
  .list .act img { width:72px; height:46px; object-fit:cover; border-radius:6px; }
  .list .ar { color:var(--muted); } .list a:hover .ar { color:var(--accent); }
  .list .d { color:var(--muted); font-size:13px; }

  /* background */
  .bg { display:grid; grid-template-columns:2fr 1fr; gap:16px; }
  .career { background:var(--card); border-radius:var(--r); padding:8px 26px; }
  .cr { display:grid; grid-template-columns:200px 1fr; gap:16px; padding:16px 0; border-bottom:1px solid var(--line); }
  .cr:last-child { border-bottom:0; }
  .cr b { font:500 18px Fraunces, serif; } .cr span { color:#5b574f; font-size:14px; } .cr small { display:block; color:var(--muted); font-size:13px; }
  .contact { background:var(--ink); color:#f3f0ea; border-radius:var(--r); padding:28px; display:flex; flex-direction:column; justify-content:space-between; }
  .contact b { font:500 30px/1.1 Fraunces, serif; }
  .contact span { color:#b9b3a8; font-size:14px; }
  .contact:hover b { color:#f1a06d; }
  footer { text-align:center; color:var(--muted); padding:48px 0 0; font-size:13px; }

  @media (max-width:900px) {
    .intro, .hero, .bg { grid-template-columns:1fr; }
    .avatar { min-height:220px; max-width:220px; }
    .hero .img { min-height:220px; }
    .grid { grid-template-columns:1fr 1fr; }
    .grid.two { grid-template-columns:1fr; } .grid.four { grid-template-columns:1fr 1fr; }
    .list a { grid-template-columns:64px minmax(0,1fr) 16px; gap:12px; } .list .act { display:none; }
    .cr { grid-template-columns:1fr; gap:2px; }
    .me h1 { font-size:42px; }
  }
  @media (max-width:560px) {
    .grid, .grid.four { grid-template-columns:1fr; } .me { padding:24px; gap:20px; }
    .avatar { display:none; } .me .mini { display:block; }
    .me h1 { font-size:36px; } .me h1 span { display:block; margin:6px 0 0; font-size:17px; }
    .me p { font-size:16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <section class="intro">
    <div class="me">
      <div class="head"><h1>Zhen Li<span>李珎</span></h1><div class="mini" role="img" aria-label="Zhen Li"></div></div>
      <p id="lede"></p>
      <div class="links" id="links"></div>
    </div>
    <div class="avatar"></div>
  </section>

  <div class="nav"><div>
    <a href="#ships">Ships</a><a href="#talks">Writing &amp; talks</a><a href="#background">Background</a>
  </div></div>

  <h2 class="sec" id="ships"><b>Ships</b><span class="k">What I built</span></h2>
  <div id="hero"></div>
  <div class="grid" id="shipGrid"></div>

  <h2 class="sec" id="talks"><b>Writing &amp; talks</b><span class="k">Selected</span></h2>
  <div class="grid two" id="talkGrid"></div>
  <div class="grid four" id="talkGrid2"></div>
  <h2 class="sec" style="margin-top:44px"><b style="font-size:22px">Podcasts, panels &amp; press</b><span class="k">Appearances</span></h2>
  <div class="list" id="talkList"></div>

  <h2 class="sec" id="background"><b>Background</b><span class="k">Career &amp; education</span></h2>
  <div class="bg">
    <div class="career" id="career"></div>
    <a class="contact" id="contact"><span class="k" style="color:#b9b3a8">Contact</span><div><b>Say hi ↗</b><br><span id="em"></span></div></a>
  </div>
  <footer>© Zhen Li · zhenthebuilder.com</footer>
</div>
<script src="/site-data.js"></script>
<script>
const Z = window.ZHEN;
document.getElementById('lede').innerHTML = `${Z.role}.<br><b style="color:var(--ink);font-weight:500">${Z.tagline}.</b> Previously at Google and ByteDance.`;
document.getElementById('links').innerHTML = Z.links.map(([t,u])=>`<a href="${u}" target="_blank">${t}</a>`).join('');
const lk = e => `<div class="lk">${e.links.map(([t,u])=>`<a href="${u}" target="_blank">${t} ↗</a>`).join('')}</div>`;
const href = e => e.links[0][1];
const media = e => e.photo
  ? `<a class="img ${e.photoFit==='contain'?'contain':''}" href="${href(e)}" target="_blank" tabindex="-1" aria-hidden="true"><img src="${e.photo}" alt="" loading="lazy" ${e.capTop?'style="object-position:center top"':''}></a>`
  : `<a class="img" href="${href(e)}" target="_blank" tabindex="-1" aria-hidden="true"><div class="poster"><span class="k">${e.poster.kicker}</span><b class="${e.poster.small?'sm':''}">${e.poster.big}</b></div></a>`;
const card = e => `<article class="card">${media(e)}<div class="body"><span class="k">${e.label}</span><h3><a href="${href(e)}" target="_blank">${e.title}</a></h3><p>${e.blurb}</p>${lk(e)}</div></article>`;

const ships = Z.events.filter(e=>e.kind==='ship');
const hero = ships.find(e=>e.hero);
document.getElementById('hero').innerHTML = `<article class="hero">
  <div class="img" style="background-image:url(${hero.photo})"></div>
  <div class="txt"><div><span class="k">${hero.label} · The first one</span><h3>${hero.title}</h3><p>${hero.blurb}</p></div>${lk(hero)}</div></article>`;
document.getElementById('shipGrid').innerHTML = ships.filter(e=>!e.hero).map(card).join('');

const rest = Z.events.filter(e=>e.kind!=='ship');
document.getElementById('talkGrid').innerHTML = rest.filter(e=>e.featured===1).map(card).join('');
document.getElementById('talkGrid2').innerHTML = rest.filter(e=>e.featured===2).sort((a,b)=>a.order-b.order).map(card).join('');
const verb = e => e.podcast ? 'Listen' : e.kind==='writing' ? 'Read' : /youtube|video/i.test(href(e)+e.links[0][0]) ? 'Watch' : 'View';
const HOSTS = {'x.com':'X','youtube.com':'YouTube','substack.com':'Substack','xiaoyuzhoufm.com':'小宇宙','podcasts.apple.com':'Apple Podcasts','linkedin.com':'LinkedIn','replit.com':'Replit','microsoft.com':'Microsoft'};
const platform = u => { const h = new URL(u).hostname; const k = Object.keys(HOSTS).find(k => h===k || h.endsWith('.'+k)); return k ? HOSTS[k] : h; };
const where = e => [...new Set(e.links.map(l=>platform(l[1])))].join(' · ');
document.getElementById('talkList').innerHTML = rest.filter(e=>!e.featured).sort((a,b)=>b.date.localeCompare(a.date)).map(e=>
  `<a href="${href(e)}" target="_blank"><span class="d">${e.label}</span><span><span class="t" ${e.lang==='zh'?'lang="zh"':''}>${e.title}</span>${e.blurb?`<span class="sub">${e.blurb}</span>`:''}</span><span class="act">${e.photo?`<img src="${e.photo}" alt="">`:''}${verb(e)}${e.lang==='zh'?' · 中文':''} on ${where(e)}</span><span class="ar" aria-hidden="true">↗</span></a>`).join('');

document.getElementById('career').innerHTML = [...Z.career, Z.education].map(([o,r,d])=>`<div class="cr"><b>${o}</b><span>${r}<small>${d}</small></span></div>`).join('');
document.getElementById('contact').href = 'mailto:' + Z.email;
document.getElementById('em').textContent = Z.email;

// highlight current section in nav
const navs = [...document.querySelectorAll('.nav a')];
const secs = ['ships','talks','background'].map(id=>document.getElementById(id));
const setNav = () => {
  let cur = 'ships';
  for (const s of secs) if (s.getBoundingClientRect().top < innerHeight*0.35) cur = s.id;
  if (innerHeight + scrollY >= document.body.scrollHeight - 4) cur = 'background';
  navs.forEach(n => { const on = n.getAttribute('href')==='#'+cur; n.classList.toggle('on', on); on ? n.setAttribute('aria-current','true') : n.removeAttribute('aria-current'); });
};
addEventListener('scroll', setNav, {passive:true}); setNav();
</script>
</body>
</html>
